[pytest]
testpaths = tests
markers =
    unit: comportamento isolado sem API ou banco real
    integration: contrato de API e persistencia usando banco temporario isolado
    e2e: jornada completa atraves da API ou de navegador real
    postgres: integracao com PostgreSQL real descartavel
    browser: E2E de navegador com Playwright e serviços reais
addopts = -ra
