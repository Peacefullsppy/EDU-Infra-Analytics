name: edu-infra-analytics
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: edu_infra
      POSTGRES_USER: edu_infra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo infra/.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu_infra -d edu_infra"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
