name: CI do PFC - EDU-Infra Analytics 1.6

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unitarios:
    name: Testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlite://"
      JWT_SECRET_KEY: "chave-descartavel-de-testes-unitarios-com-mais-de-32-bytes"
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Python 3.13 e cache de dependências
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Executar somente testes isolados
        run: python -m pytest -q tests/unit tests/integration -m unit --strict-markers

  integracao:
    name: Testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: edu_infra
          POSTGRES_PASSWORD: ci-password-only
          POSTGRES_DB: edu_infra
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U edu_infra -d edu_infra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "postgresql+psycopg://edu_infra:ci-password-only@127.0.0.1:5433/edu_infra"
      JWT_SECRET_KEY: "chave-descartavel-de-integracao-com-mais-de-32-bytes"
      EDU_TEST_POSTGRES_DISPOSABLE: "SIM"
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Python 3.13 e cache de dependências
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Preparar esquema do PostgreSQL descartável
        run: |
          python -m alembic upgrade head
          python -m scripts.check_db
      - name: Executar somente testes de API e persistência
        run: python -m pytest -q tests/unit tests/integration -m integration --strict-markers

  linter:
    name: Linter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Python 3.13 e cache de dependências
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar Ruff
        run: python -m pip install "ruff>=0.9,<1"
      - name: Verificar regras reais do projeto
        run: ruff check .
